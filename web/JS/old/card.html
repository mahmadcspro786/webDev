<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Builder</title>
    <style>
        /* Basic styling for layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            width: 320px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .image-container {
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 3px 6px;
            font-size: 12px;
            border-radius: 4px;
        }
        .content {
            padding: 12px;
        }
        .content h3 {
            font-size: 16px;
            margin: 0 0 8px 0;
            color: #0f0f0f;
        }
        .content p {
            font-size: 13px;
            color: #606060;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cards will be dynamically injected here -->
    </div>

    <script src="card.js"></script>
</body>
</html>
